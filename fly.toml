# Quyết định + lý do cho MỌI giá trị dưới đây: docs/architecture-brief.md §5.
# File này bị `fly launch`/`fly deploy` sinh lại và XOÁ COMMENT (đã xảy ra 23/07)
# nên KHÔNG ghi lý do ở đây — ghi ở §5. Giá trị nhạy (min_machines_running=1,
# path=/api/healthz) giải thích tại đó; sửa file này thì đọc §5 trước.

app = 'microsched'
primary_region = 'sin'
swap_size_mb = 512

[env]
  APP_ENV = 'production'
  ENABLE_INPROCESS_CRON = 'true'
  MIMI_PUBLIC_ORIGIN = 'https://microsched.fly.dev'
  MIMI_REAL_CHAT_ENABLED = 'true'
  MIMI_LIVE_PROVIDER_ENABLED = 'true'
  MIMI_CONTEXT_V1_ENABLED = 'true'
  MIMI_RUNNER = 'langgraph'
  MIMI_WORKFLOW_PILOT_ENABLED = 'false'
  MIMI_TRANSPORT = 'openai_sdk'
  MIMI_TEXT_RESPONSE_FORMAT = 'natural'
  MIMI_ROUTE_MODE = 'exact'
  MIMI_ROUTE_MODEL = 'deepseek/deepseek-v4.1-flash'
  MIMI_ROUTE_PROVIDER = 'deepinfra'
  MIMI_ROUTE_QUANTIZATION = 'fp8'
  MIMI_ROUTE_REASONING_EFFORT = 'high'
  MIMI_ROUTE_CONTEXT_TOKENS = '1048576'
  MIMI_COMPACTION_TRIGGER_TOKENS = '100000'
  MIMI_ROUTE_MAX_OUTPUT_TOKENS = '8192'
  MIMI_ROUTE_MAX_INPUT_PRICE = '0.20'
  MIMI_ROUTE_MAX_OUTPUT_PRICE = '0.60'
  MIMI_ROUTE_REQUIRE_ZDR = 'true'
  MIMI_MAX_PAYLOAD_BYTES = '2097152'
  MIMI_MAX_ACTIVE_RUNS = '2'
  MIMI_RUN_MAX_TURNS = '32'
  MIMI_RUN_MAX_TOOL_CALLS = '64'
  MIMI_RUN_DEADLINE_SECONDS = '1800'
  MIMI_PREVIEW_TTL_MINUTES = '15'

[deploy]
  strategy = 'immediate'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
